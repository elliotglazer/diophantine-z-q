name: Version 15 finite artifact checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        kind: ['314', '233', 'huge']
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify snapshot and replay existing finite check
        env:
          KIND: ${{ matrix.kind }}
        run: >-
          python -B scripts/v15/run_finite.py
          --repository research/version15/snapshots/v15-018
          --manifest-sha256 8a10b6a6405adabf25ad8359900c7681251cf710a24bb4926feec261a411df6c
          --scratch "$RUNNER_TEMP/v15-$KIND"
          --kind "$KIND"

  current-222:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify current 222-variable tables and weighted sum of squares
        run: python -B research/version15/quartics/quartic-222/verify.py
