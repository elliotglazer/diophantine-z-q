name: Research checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quartic389:
    name: Conditional 389/385-variable and scalar-chain replay
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify the frozen research package
        run: python -B research/conditional-quartic-reduction/reproduce.py --check-source
      - name: Rebuild all 23 construction and audit stages
        run: python -B research/conditional-quartic-reduction/reproduce.py --output build/quartic-389
      - name: Check the complete import and reproduction manifests
        run: >-
          python -B research/conditional-quartic-reduction/review_tools/check_pr_reproduction_manifest.py
          research/conditional-quartic-reduction --reference build/quartic-389
          --report build/quartic-389/import-review.json
      - name: Rebuild and check the four factored poles
        run: >-
          python -B research/factored-pole-reduction/reproduce.py
          --baseline build/quartic-389 --output build/quartic-385
      - name: Rebuild and check the order-31 scalar chain
        run: >-
          python -B research/scalar-chain-reduction/reproduce.py
          --output build/scalar-chain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: conditional-quartic-389-385-chain-receipts
          path: |
            build/quartic-389/reproduction-receipt.json
            build/quartic-389/pipeline-progress.json
            build/quartic-389/pipeline-completion.json
            build/quartic-389/construction.log
            build/quartic-389/import-review.json
            build/quartic-389/audit/*check.json
            build/quartic-389/construction/*check.json
            build/quartic-385/reproduction-receipt.json
            build/quartic-385/reproduce.log
            build/quartic-385/parent-check.json
            build/quartic-385/candidate385/*check.json
            build/quartic-385/candidate385/balanced/summary.json
            build/quartic-385/candidate385/quartic-385-balanced-decimal.txt
            build/scalar-chain/reproduction-receipt.json
            build/scalar-chain/reproduction.log
            build/scalar-chain/candidate/*check.json
            build/scalar-chain/factored/*check.json
            build/scalar-chain/factored/balanced/summary.json
            build/scalar-chain/factored/quartic-385-balanced-decimal.txt
  quartic394:
    name: Version 13 source and quartic replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    steps:
      - name: Enable long paths for checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -B docs/manuscript-revisions/version13/portability/test_portability.py
      - run: python -B scripts/check_quartic394_portable.py
      - run: python -B docs/manuscript-revisions/version13/validate-applications.py --repo . --self-test
      - run: python -B quartics/quartic-299-314/verify_lineage.py
      - run: python -B docs/manuscript-revisions/version14/validate-applications.py --repo . --self-test
      - run: python -B scripts/check_audit_history.py --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-394-${{ matrix.os }}
          path: build/quartic-394/
  quartic498:
    name: Version 12 source and quartic replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    steps:
      - name: Enable long paths for checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python -B scripts/check_audit_history.py --self-test
      - run: python -B scripts/check_quartic498.py
      - run: python -B docs/manuscript-revisions/version12/inventory/validate.py --repo . --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-498-${{ matrix.os }}
          path: build/quartic-498/
  oddproduct:
    name: Version 9 odd-product replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12.14'
          - os: windows-2022
            python: '3.12.10'
    steps:
      - name: Enable long paths for checkout
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python -B scripts/check_odd_product.py
      - run: python -B docs/quartic-523-540/inventory.py validate
      - run: python -B docs/manuscript-revisions/version10/check.py
      - run: python -B docs/manuscript-revisions/version10/check_valuation.py
      - run: python -B scripts/check_audit_history.py --self-test
      - run: python -B -m unittest discover -s docs/quartic-523-540 -p test_inventory.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: odd-product-${{ matrix.os }}
          path: build/odd-product/
  quartic962:
    name: Version 6 quartic reproduction and inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python scripts/check_quartic962.py --out build/quartic-962-reproduction
      - run: python -E -B docs/quartic-962/inventory.py validate --repo . --manuscript manuscripts/quartic_v7.tex --expected-input-sha256 36646fd26f5adcaed33315605e4b1c333c1e60f5c917aeeda63976614823a0f5
      - run: python -E -B -m unittest discover -s docs/quartic-962 -p test_inventory.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-962-reproduction
          path: build/quartic-962-reproduction/
  quartic1272:
    name: Reconstructed quartic and Version 5 inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python scripts/check_quartic1272.py --out build/quartic-1272-reproduction
      - run: python -E -B scripts/check_historical_inventory.py 5 validate --repo . --manuscript quartic_1272.tex --expected-input-sha256 695769c38917efa35b6256132cd8b77807d6384ab6d27c38f250ff8947ae6c10
      - run: python -E -B scripts/check_historical_inventory.py 5 test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quartic-1272-reproduction
          path: build/quartic-1272-reproduction/
  construction:
    name: Construction regeneration and finite checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - run: python scripts/check_construction.py --report build/construction-checks.json
      - run: python -B docs/audit-history/issue3/replay_row_hash.py
      - run: python scripts/check_lean.py
      - name: Validate theorem inventory bindings and references
        run: python docs/theorem-application-audit/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: construction-checks
          path: build/construction-checks.json

  paper:
    name: Paper build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Test publication version rules and current-pair validation
        run: |
          python -B -m unittest discover -s scripts -p test_version_increment.py -v
          python -B -m unittest discover -s scripts -p test_current_manuscript.py -v
      - name: Enforce the next published integer version from the trusted event
        run: python -B scripts/check_version_increment.py --github-event
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/tectonic
          key: tectonic-${{ runner.os }}-0.17.0-6ffe055852f8faf66
      - run: python -E -B scripts/check_manuscript_revision.py
      - run: python -B docs/quartic-523-540/inventory.py validate
      - run: python -B docs/manuscript-revisions/version10/check.py
      - run: python -B docs/manuscript-revisions/version10/check_valuation.py
      - run: python scripts/build_paper.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: paper-build
          path: build/paper/

  lean:
    name: Accepted Lean helpers and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Install pinned elan 4.2.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/elan-install"
          cd "$RUNNER_TEMP/elan-install"
          curl --fail --location --retry 3 -o elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check -
          tar -xzf elan.tar.gz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # Fetch upstream artifacts directly. Archiving the entire toolchain and
      # Mathlib tree again can exhaust the runner's disk during cache saving.
      - name: Fetch pinned dependency cache
        run: python scripts/fetch_lean_cache.py
      - name: Build every helper from fresh project artifacts and audit axioms
        run: python scripts/check_lean.py --build --output build/lean-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lean-audit
          path: |
            build/lean-ci/*.json
            build/lean-ci/*.log
