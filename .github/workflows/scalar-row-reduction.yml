name: Scalar row reduction research replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalar-row-reduction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalar-row-reduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python -B research/scalar-row-reduction/reproduce.py --output build/row379
      - run: python -B scripts/check_audit_history.py --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scalar-row-reduction-379
          path: |
            build/row379/MEASURED.json
            build/row379/replay.log
            build/row379/*check.json
            build/row379/balanced/summary.json
            build/row379/quartic-*-balanced-decimal.txt
