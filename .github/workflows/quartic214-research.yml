name: Quartic 214 research checks

on:
  pull_request:
    paths:
      - 'research/quartic214/**'
      - 'research/quartic214-protocol-d-public/**'
      - 'research/version14/**'
      - 'research/version15/**'
      - '.github/workflows/quartic214-research.yml'
  push:
    branches:
      - 'proposal/quartic-214-protocol-d'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    name: 214 rows, coefficients and review-record consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Rebuild and verify the exact family
        run: |
          python -B research/quartic214/construction/build.py
          python -B research/quartic214/construction/check_exact.py
          python -B research/quartic214/height/numeric_certificate.py --self-test
          python -B research/quartic214/check_port.py
      - name: Check declared review relationships and negative controls
        run: python -B research/quartic214-protocol-d-public/check_records.py --self-test
      - name: Check retained audit history
        run: python -B scripts/check_audit_history.py --self-test
      - name: Require reproducible committed artifacts
        run: git diff --exit-code -- research/quartic214 research/quartic214-protocol-d-public
