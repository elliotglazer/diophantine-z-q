name: Quartic 214 receiving revision 2

on:
  pull_request:
    paths:
      - 'research/quartic214-manuscript-revision2/**'
      - 'research/version17/**'
      - 'research/quartic214-manuscript/**'
      - 'research/quartic214-manuscript-review/**'
      - 'research/quartic214-protocol-d-progress/**'
      - 'research/quartic214/**'
      - 'manuscripts/quartic_v16.tex'
      - 'CURRENT_214_REVIEW.md'
      - '.github/workflows/quartic214-manuscript-revision2.yml'
  push:
    branches:
      - 'proposal/quartic-214-protocol-d'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiving-revision:
    name: Serial receiving TeX/PDF and review bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify the exact receiving revision
        run: python -B research/quartic214-manuscript-revision2/assemble.py --check
      - name: Rebuild the full PDF serially within its resource limits
        run: python -B research/quartic214-manuscript-revision2/build_pdf.py --check
      - name: Check current receiving bindings and rejection controls
        run: |
          ulimit -v 524288
          python -B research/version17/ci-compatibility/run.py revision2-check
      - name: Check retained audit history
        run: python -B scripts/check_audit_history.py --self-test
      - name: Require unchanged committed artifacts
        run: git diff --exit-code
