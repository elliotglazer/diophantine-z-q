name: PR154 comment permission probe
on:
  push:
    branches: [codex/pr154-permission-probe]
    paths: [.github/workflows/pr154-permission-probe.yml]
permissions: {}
jobs:
  comment:
    name: Probe issue-comment permission on PR154
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Attempt exactly one issue-comment request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys, urllib.request, urllib.error
          repo = 'elliotglazer/diophantine-z-q'
          run = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          body = ('PR154 permission probe. This is one harmless issue-comment API call '
                  'with issues: write and pull-requests: read, without model calls or environment secrets. '
                  f'Run: https://github.com/{repo}/actions/runs/{run}, attempt {attempt}.')
          record = {'repository': repo, 'pr': 154, 'run': run, 'attempt': attempt,
                    'source_sha': os.environ['GITHUB_SHA'], 'method': 'POST',
                    'endpoint': '/repos/'+repo+'/issues/154/comments', 'request_count': 1,
                    'configured_permissions': {'issues': 'write', 'pull-requests': 'read'}}
          request = urllib.request.Request('https://api.github.com'+record['endpoint'],
              data=json.dumps({'body': body}).encode(), method='POST', headers={
              'Authorization': 'Bearer '+os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  record['http_status'] = response.status
                  result = json.load(response)
              record['comment'] = {k: result.get(k) for k in ('id','html_url','body','created_at')}
              record['body_matches'] = result.get('body') == body
          except urllib.error.HTTPError as error:
              record.update(http_status=error.code, response_body=error.read().decode('utf-8', errors='replace'))
          except Exception as error:
              record.update(uncertain=True, error_type=type(error).__name__)
          pathlib.Path('permission-probe.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,indent=2))
          sys.exit(0 if record.get('http_status') == 201 and record.get('body_matches') else 1)
          PY
      - name: Preserve exact result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr154-permission-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: permission-probe.json
          if-no-files-found: error
          retention-days: 30
