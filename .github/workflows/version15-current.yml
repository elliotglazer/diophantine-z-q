name: Version 15 current quartic verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  current-222:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Verify current 222-variable tables and weighted sum of squares
        run: python -B research/version15/quartics/quartic-222/verify.py
