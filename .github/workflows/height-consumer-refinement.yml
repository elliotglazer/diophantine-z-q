name: Sharper height consumers research replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: height-consumer-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  height-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        order: [45, 47]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python -B research/height-consumer-refinement/reproduce.py --order ${{ matrix.order }} --output build/height
      - run: python -B scripts/check_audit_history.py --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: height-consumers-order-${{ matrix.order }}
          path: |
            build/height/MEASURED.json
            build/height/replay.log
            build/height/*check.json
            build/height/balanced/summary.json
            build/height/quartic-*-balanced-decimal.txt
