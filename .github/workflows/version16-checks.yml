name: Version 16 correction checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correction-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Check exact manuscript corrections and artifact bindings
        run: python -B research/version16/check.py
