name: Quartic 214 receiving revision 3

on:
  pull_request:
    paths:
      - 'research/quartic214*/**'
      - 'CURRENT_214_REVISION3.md'
      - '.github/workflows/quartic214-manuscript-revision3.yml'
  push:
    branches: ['proposal/quartic-214-protocol-d']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiving-revision:
    name: Revision 3 full PDF and independent repair bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify complete source, rebuild PDF, and check independent repair bindings
        run: |
          python -B research/quartic214-manuscript-revision3/assemble.py --check
          python -B research/quartic214-manuscript-revision3/build_pdf.py --check
          python -B research/quartic214-manuscript-revision3/check_records.py --self-test --reviewed-artifacts
          python -B scripts/check_audit_history.py --self-test
          git diff --exit-code
