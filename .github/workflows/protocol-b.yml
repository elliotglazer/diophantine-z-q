# Prepared but inactive. MODE is off unless the owner enables test/live.
# No checkout, cache restore, dependency install, or candidate executable.
name: Protocol B

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: protocol-b-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  run_reviewers:
    name: Run reviewers and publish App check
    if: >-
      (vars.PROTOCOL_B_MODE == 'live' || vars.PROTOCOL_B_MODE == 'test') &&
      (github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/protocol-b review' || startsWith(github.event.comment.body, '/protocol-b override '))))
    runs-on: ubuntu-24.04
    environment: protocol-b
    timeout-minutes: 120
    steps:
      - name: Mint check-only App token
        id: app_start
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PROTOCOL_B_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_B_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Review pinned sources using both approved models
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app_start.outputs.token }}
          APP_ID: ${{ vars.PROTOCOL_B_APP_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE: ${{ vars.PROTOCOL_B_MODE }}
          TEST_PR: ${{ vars.PROTOCOL_B_TEST_PR }}
        run: |
          cat > "$RUNNER_TEMP/protocol-b.py" <<'PROTOCOL_B_PYTHON'
          """Embedded in the trusted default-branch workflow; never imports candidate code."""
          import base64
          import concurrent.futures
          import datetime
          import functools
          import json
          import math
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          MODELS = {"astra": "gpt-6-astra", "fable": "claude-fable-5-2"}
          CHECK = "Protocol B / review"
          MARKER = "<!-- protocol-b-review-v1 -->"
          INSTRUCTIONS = ".github/protocol-b-reviewer.md"
          WORKFLOW = ".github/workflows/protocol-b.yml"
          WORKING_MARKER = "<!-- protocol-b-working-v2 -->"
          CONTEXT_TOKEN_BUDGET = 400_000
          OUTPUT_TOKEN_BUDGET = 64_000
          FORMAT_TOKEN_RESERVE = 8_192
          RECOVERY_TOKEN_RESERVE = 4_096
          WEB_MAX_USES = {'web_search': 3, 'web_fetch': 5}
          WEB_FETCH_MAX_CONTENT_TOKENS = 20_000
          # Search has no content-token cap, and the fetch cap does not cover binary
          # PDFs. These are accounting reserves, not provider-enforced limits.
          WEB_SEARCH_RESULT_RESERVE = 16_000
          WEB_BINARY_RESULT_RESERVE = 128_000
          REQUIRED_COMPUTATIONS = {
              "Accepted Lean helpers and axiom audit", "Construction regeneration and finite checks",
              "Paper build", "Reconstructed quartic and Version 5 inventory",
              "Version 12 source and quartic replay (ubuntu-24.04)",
              "Version 12 source and quartic replay (windows-2022)",
              "Version 13 source and quartic replay (ubuntu-24.04)",
              "Version 13 source and quartic replay (windows-2022)",
              "Version 6 quartic reproduction and inventory",
              "Version 9 odd-product replay (ubuntu-24.04)",
              "Version 9 odd-product replay (windows-2022)",
              "Complete kernel build and exact-target audit",
              "Current 214-variable quartic and numerical certificate", "current-222",
          }
          OUT = pathlib.Path(os.environ.get("RUNNER_TEMP", ".")) / "protocol-b-reports"


          def record(name, value):
              OUT.mkdir(parents=True, exist_ok=True)
              (OUT / name).write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")


          def log(message):
              print(datetime.datetime.now(datetime.timezone.utc).isoformat(), message, flush=True)


          class RequestError(RuntimeError):
              """An HTTP failure with its status preserved for narrow caller handling."""
              def __init__(self, detail):
                  self.status = detail['status']
                  super().__init__(json.dumps(detail))


          def request(url, headers, method="GET", data=None, stream=False):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(url, data=payload, method=method,
                                           headers={"Content-Type": "application/json", **headers})
              for attempt in range(3):
                try:
                  response = urllib.request.urlopen(req, timeout=180)
                  break
                except urllib.error.HTTPError as error:
                  # Preserve the actual server error; never print headers containing credentials.
                  with error:
                      body = error.read().decode("utf-8", errors="replace")
                  safe_headers = {k: v for k, v in error.headers.items()
                                  if k.lower() in {"x-github-request-id", "request-id", "x-request-id",
                                                   "retry-after", "x-ratelimit-remaining", "x-ratelimit-reset"}}
                  detail = {"url": url, "method": method, "status": error.code,
                            "headers": safe_headers, "body": body}
                  for secret in (os.environ.get(k) for k in ("GH_TOKEN", "APP_TOKEN", "OPENAI_API_KEY", "ANTHROPIC_API_KEY")):
                      if secret:
                          detail = json.loads(json.dumps(detail).replace(secret, "[REDACTED]"))
                  record("http-error-" + str(time.time_ns()) + ".json", detail)
                  try:
                      spend_cap = json.loads(body).get('error', {}).get('details', {}).get('error_code') == 'enforced_spend_limit_reached'
                  except (ValueError, AttributeError):
                      spend_cap = False
                  # Only retry a provider's initial HTTP rejection, before receiving a
                  # stream. Never replay GitHub writes or a partially consumed stream.
                  if (stream and url in {"https://api.openai.com/v1/responses", "https://api.anthropic.com/v1/messages"}
                          and not spend_cap and (error.code == 429 or 500 <= error.code <= 599) and attempt < 2):
                      try:
                          requested = float(error.headers.get('Retry-After', '0'))
                      except ValueError:
                          requested = 0
                      if not math.isfinite(requested) or requested > 300:
                          raise RuntimeError('Provider Retry-After exceeds the five-minute retry budget; not retrying early. ' + json.dumps(detail)) from None
                      delay = max(65 * 2 ** attempt if error.code == 429 else 2 ** (attempt + 1), requested)
                      log(f"Provider HTTP {error.code}; retry {attempt+1}/2 after {delay}s before any stream output")
                      time.sleep(delay)
                      continue
                  raise RequestError(detail) from None
              if stream:
                  return response
              with response:
                  raw = response.read()
                  return json.loads(raw) if raw else None


          class GitHub:
              def __init__(self, repo, token):
                  if not re.fullmatch(r"[\w.-]+/[\w.-]+", repo):
                      raise ValueError("Invalid repository")
                  self.repo = repo
                  self.headers = {"Authorization": "Bearer " + token,
                                  "Accept": "application/vnd.github+json",
                                  "X-GitHub-Api-Version": "2022-11-28"}

              def api(self, path, method="GET", data=None):
                  return request("https://api.github.com" + path, self.headers, method, data)

              def call(self, path, method="GET", data=None):
                  return self.api("/repos/" + self.repo + path, method, data)

              def pages(self, path):
                  result = []
                  for page in range(1, 501):
                      rows = self.call(path + ("&" if "?" in path else "?") + f"per_page=100&page={page}")
                      if not isinstance(rows, list):
                          raise ValueError("Expected a list from " + path)
                      result.extend(rows)
                      if len(rows) < 100:
                          return result
                  raise ValueError("Pagination limit reached; no partial review is allowed")

              @functools.lru_cache(maxsize=32)
              def text(self, path, ref):
                  if not re.fullmatch(r"[0-9a-f]{40}", ref):
                      raise ValueError("Source ref must be a commit")
                  if path.startswith("/") or any(p in {"", ".", ".."} for p in path.split("/")):
                      raise ValueError("Invalid repository path")
                  try:
                      value = self.call("/contents/" + urllib.parse.quote(path, safe="/") + "?ref=" + ref)
                  except RequestError as error:
                      if error.status != 404:
                          raise
                      # An added/deleted/renamed file can be absent at this pinned revision.
                      # Review.run returns ValueError as a tool result, without counting a read.
                      raise ValueError(f"File {path!r} was not found at commit {ref} (HTTP 404). Check the path and requested revision; the file may exist only at the other revision.") from None
                  if not isinstance(value, dict) or value.get("type") != "file":
                      raise ValueError("Not a regular file")
                  if value["size"] > 16_000_000:
                      raise ValueError("File exceeds 16 MB; use its specification or request a smaller review")
                  if value.get("encoding") != "base64":
                      value = self.call("/git/blobs/" + value["sha"])
                  return base64.b64decode(value["content"], validate=False).decode("utf-8")


          def classify(files, declaration):
              """Editorial paths plus a complete diff guard; ambiguous changes escalate."""
              if not files:
                  raise ValueError("Empty or unavailable diff")
              editorial_paths = {"README.md", "CREDITS.md"}
              math_text = re.compile(r"[0-9$\\=<>^]|\b(theorem|lemma|proof|claim|conjecture|axiom|degree|quartic|polynomial|variable|coefficient|bound|rational|integer|diophantine|decidab\w*|verif\w*|audit\w*|protocol|require\w*|policy)\b", re.I)
              editorial = declaration and all(
                  f["status"] == "modified" and f["filename"].endswith(".md") and
                  not f["filename"].startswith((".github/", "docs/research-review/")) and f["filename"] != "PROJECT.md" and
                  "patch" in f and
                  sum(x.startswith("+") for x in f["patch"].splitlines()) == f["additions"] and
                  sum(x.startswith("-") for x in f["patch"].splitlines()) == f["deletions"] and
                  ([x[1:].rstrip() for x in f["patch"].splitlines() if x.startswith("+")] ==
                   [x[1:].rstrip() for x in f["patch"].splitlines() if x.startswith("-")] or
                   (f["filename"] in editorial_paths and not math_text.search("\n".join(
                       x[1:] for x in f["patch"].splitlines() if x.startswith(("+", "-"))))))
                  for f in files)
              if editorial:
                  return "editorial"
              # Unavailable/binary diffs, additions, policy, dependencies and a new record
              # all get the broader review. No author label can downgrade the rule.
              new = re.compile(r"\b(theorem|corollary|proposition|record|route|dependency|axiom|import|cite)\b|\\(?:cite|begin\{theorem)", re.I)
              for f in files:
                  path = f["filename"]
                  if (f["status"] != "modified" or "patch" not in f or
                      path.startswith(".github/") or path in {"PROJECT.md", "lake-manifest.json", "lean-toolchain"} or
                      path.startswith(("docs/research-review/", "docs/current-manuscript", "docs/release-policy")) or
                      new.search("\n".join(x for x in f["patch"].splitlines() if x.startswith(("+", "-"))))):
                      return "new result or route"
              return "local mathematical"


          FINISH_SCHEMA = {
              "type": "object", "additionalProperties": False,
              "properties": {
                  "decision": {"type": "string", "enum": ["accept", "changes_requested"]},
                  "report": {"type": "string", "description": "Full substantive review with source locations, scope and limitations."},
                  "findings": {"type": "array", "items": {"type": "object", "additionalProperties": False,
                      "properties": {"id": {"type": "string"}, "location": {"type": "string"},
                                     "objection": {"type": "string"}}, "required": ["id", "location", "objection"]}},
                  "prior_findings": {"type": "array", "items": {"type": "object", "additionalProperties": False,
                      "properties": {"id": {"type": "string"}, "resolution": {"type": "string", "enum": ["resolved", "unresolved", "overridden"]},
                                     "reason": {"type": "string"}}, "required": ["id", "resolution", "reason"]}},
                  "sources_read": {"type": "array", "items": {"type": "string"}},
                  "not_outside_reviewed": {"type": "array", "items": {"type": "string"}},
              }, "required": ["decision", "report", "findings", "prior_findings", "sources_read", "not_outside_reviewed"],
          }
          TOOLS = [
              {"name": "read_file", "description": "Read a pinned PR or base text file by lines; binary PDFs return a pinned public URL. Never executes content.",
               "parameters": {"type": "object", "properties": {"path": {"type": "string"},
                 "revision": {"type": "string", "enum": ["head", "base"]}, "start": {"type": "integer"}, "count": {"type": "integer"}},
                 "required": ["path", "revision", "start", "count"], "additionalProperties": False}},
              {"name": "list_files", "description": "List pinned head paths with a literal substring; results are paged, never silently truncated.",
               "parameters": {"type": "object", "properties": {"contains": {"type": "string"}, "offset": {"type": "integer"}},
                 "required": ["contains", "offset"], "additionalProperties": False}},
              {"name": "read_history", "description": "After reading primary proof sources, obtain all previous PR review findings and discussion. Required before final decision.",
               "parameters": {"type": "object", "properties": {}, "required": [], "additionalProperties": False}},
              {"name": "finish_review", "description": "Deliver the complete final review, including disposition of every earlier finding. This does not itself approve GitHub.",
               "parameters": FINISH_SCHEMA},
          ]


          def validate_review(value, prior_ids, overrides):
              if set(value) != set(FINISH_SCHEMA["required"]):
                  raise ValueError("Incomplete final report")
              if value["decision"] not in {"accept", "changes_requested"} or not isinstance(value["report"], str) or len(value["report"]) < 80:
                  raise ValueError("Invalid decision or missing substantive report")
              for key in ("findings", "prior_findings", "sources_read", "not_outside_reviewed"):
                  if not isinstance(value[key], list):
                      raise ValueError("Expected report list: " + key)
              if not value["sources_read"]:
                  raise ValueError("No sources read")
              ids = [x["id"] for x in value["findings"]]
              if len(ids) != len(set(ids)) or any(not re.fullmatch(r"[A-Za-z0-9_-]{1,40}", i) for i in ids):
                  raise ValueError("Invalid or duplicate finding IDs")
              dispositions = value["prior_findings"]
              if len(dispositions) != len(prior_ids) or {x["id"] for x in dispositions} != prior_ids:
                  raise ValueError("Earlier findings were omitted or duplicated")
              for item in dispositions:
                  if item["resolution"] not in {"resolved", "unresolved", "overridden"} or not item["reason"].strip():
                      raise ValueError("Missing finding disposition")
                  if item["resolution"] == "overridden" and item["id"] not in overrides:
                      raise ValueError("No authenticated collaborator override")
              if any(x["resolution"] == "overridden" for x in dispositions) and not value["not_outside_reviewed"]:
                  raise ValueError("Override must leave the affected claim not outside reviewed")
              if value["decision"] == "accept" and (value["findings"] or any(x["resolution"] == "unresolved" for x in dispositions)):
                  raise ValueError("Acceptance cannot contain unresolved objections")
              if len(json.dumps(value, ensure_ascii=False).encode()) > 45_000:
                  raise ValueError("Report exceeds permanent PR comment limit; shorten prose without omitting findings")
              return value


          def sse(response):
              """Complete SSE events. Never log hidden thinking or credential-bearing requests."""
              data = []
              with response:
                  for line in response:
                      line = line.decode("utf-8").rstrip("\r\n")
                      if not line:
                          if data:
                              text = "\n".join(data)
                              data = []
                              if text != "[DONE]":
                                  yield json.loads(text)
                      elif line.startswith("data:"):
                          data.append(line[5:].lstrip())
              if data and "\n".join(data) != "[DONE]":
                  yield json.loads("\n".join(data))


          def model_body(family, system, conversation):
              if family == "astra":
                  return {"model": MODELS[family], "instructions": system, "input": conversation,
                          "reasoning": {"effort": "high"}, "max_output_tokens": OUTPUT_TOKEN_BUDGET,
                          "store": False, "stream": True, "include": ["reasoning.encrypted_content"],
                          "tools": [{"type": "function", "strict": True, **t} for t in TOOLS] + [{"type": "web_search"}]}
              return {"model": MODELS[family], "system": system, "messages": conversation,
                      "max_tokens": OUTPUT_TOKEN_BUDGET, "stream": True, "output_config": {"effort": "high"},
                      "cache_control": {"type": "ephemeral", "ttl": "1h"},
                      "tools": [{"name": t["name"], "description": t["description"], "input_schema": t["parameters"]} for t in TOOLS] + [
                          {"type": "web_search_20260318", "name": "web_search", "max_uses": WEB_MAX_USES['web_search']},
                          {"type": "web_fetch_20260318", "name": "web_fetch", "max_uses": WEB_MAX_USES['web_fetch'],
                           "max_content_tokens": WEB_FETCH_MAX_CONTENT_TOKENS}]}


          def request_size(body):
              return len(json.dumps(body, ensure_ascii=False).encode('utf-8'))


          def context_units(family, body):
              """Account for web results without treating opaque payload bytes as tokens.

              Only provider result blocks in assistant messages get this treatment.
              Repository text and unknown block types still use conservative bytes.
              Never edit the actual messages: signatures and tool results must replay
              unchanged. The next request's initial provider usage recalibrates this
              estimate. This is not an exact tokenizer or a spending guarantee.
              """
              units = request_size(body)
              if family == 'fable':
                  for message in body['messages']:
                      if message.get('role') != 'assistant' or not isinstance(message.get('content'), list):
                          continue
                      for block in message['content']:
                          kind = block.get('type')
                          if kind == 'web_fetch_tool_result':
                              content = block.get('content')
                              if not isinstance(content, dict) or content.get('type') != 'web_fetch_result':
                                  continue  # Errors have no fetched document.
                              source = content.get('content', {}).get('source', {})
                              reserve = (WEB_FETCH_MAX_CONTENT_TOKENS if source.get('type') == 'text'
                                         else WEB_BINARY_RESULT_RESERVE)
                          elif kind == 'web_search_tool_result' and isinstance(block.get('content'), list):
                              reserve = WEB_SEARCH_RESULT_RESERVE
                          else:
                              continue
                          # Keep metadata in the byte estimate; only bound the payload.
                          payload_bytes = request_size(block['content'])
                          units -= max(0, payload_bytes - reserve)
              return units


          def web_allowance(family, conversation):
              """Direct calls carry across tool-result/pause continuations; dynamic
              filtering calls reset per request. Do not advertise a review-wide quota.
              See Claude's web-fetch-tool documentation, 'Max uses'.
              """
              if family != 'fable':
                  return {'scope': 'Provider-managed; no local web-use cap for this reviewer.'}
              used = dict.fromkeys(WEB_MAX_USES, 0)
              for message in conversation:
                  content = message.get('content')
                  if message.get('role') == 'user':
                      if not isinstance(content, list) or any(b.get('type') != 'tool_result' for b in content):
                          used = dict.fromkeys(WEB_MAX_USES, 0)
                  elif message.get('role') == 'assistant' and isinstance(content, list):
                      for block in content:
                          if (block.get('type') == 'server_tool_use' and block.get('name') in used
                                  and (block.get('caller') or {}).get('type', 'direct') == 'direct'):
                              used[block['name']] += 1  # Failed/pending calls count conservatively.
              return {'direct_this_turn': {name: max(0, cap - used[name]) for name, cap in WEB_MAX_USES.items()},
                      'programmatic_next_request_maximum': dict(WEB_MAX_USES),
                      'fetch_text_tokens_per_result': WEB_FETCH_MAX_CONTENT_TOKENS,
                      'scope': 'Direct calls share the current turn limit; programmatic calls reset per request. '
                               'Fetch text may be truncated by the provider; do not claim to have read omitted text.'}


          def context_estimate(family, system, conversation, previous=None):
              """Preflight estimate from reported tokens plus conservative byte growth.

              Count-tokens does not support this gate's server tools. Do not pretend a
              characters/4 conversion is an exact count. Include tools and instructions,
              cache reads/writes, output allowance and a formatting reserve. The provider
              can still add server-tool context internally; this is not a billing cap.
              """
              body = model_body(family, system, conversation)
              size, units = request_size(body), context_units(family, body)
              estimated = units
              basis = 'request bytes with bounded web-result accounting'
              if previous:
                  usage = previous.get('usage') or {}
                  fields = ['input_tokens', 'output_tokens']
                  if family == 'fable':
                      fields += ['cache_read_input_tokens', 'cache_creation_input_tokens']
                  if 'input_tokens' in usage and all(type(usage.get(k, 0)) is int and usage.get(k, 0) >= 0 for k in fields):
                      inputs = usage['input_tokens']
                      input_basis = 'reported input tokens'
                      if family == 'fable':
                          inputs += usage.get('cache_read_input_tokens', 0) + usage.get('cache_creation_input_tokens', 0)
                      growth = units - previous.get('context_units', previous['request_bytes'])
                      if size < previous['request_bytes'] or growth < 0:
                          raise ValueError('Review request shrank unexpectedly; no history may be silently discarded')
                      if family == 'fable':
                          # Final usage can accumulate the same cached input across
                          # internal server-tool calls. It is not the context length.
                          # Preserve message_start's input separately before deltas.
                          initial = usage.get('request_start_input_tokens')
                          if type(initial) is int and initial >= 0:
                              inputs = initial
                              input_basis = 'message_start input tokens'
                          elif previous.get('server_tools') or usage.get('server_tool_use'):
                              inputs = previous.get('estimated_input_tokens', previous.get('context_units', previous['request_bytes']))
                              input_basis = 'previous preflight (cumulative server usage excluded)'
                      estimated = inputs + max(growth, usage.get('output_tokens', 0))
                      basis = input_basis + ' plus bounded growth/output tokens'
              total = estimated + FORMAT_TOKEN_RESERVE + OUTPUT_TOKEN_BUDGET
              observation = {'family': family, 'request_bytes': size, 'context_units': units, 'estimated_input_tokens': estimated,
                             'format_reserve': FORMAT_TOKEN_RESERVE, 'output_reserve': OUTPUT_TOKEN_BUDGET,
                             'estimated_total': total, 'budget': CONTEXT_TOKEN_BUDGET, 'basis': basis}
              return observation


          def context_budget(family, system, conversation, previous=None):
              observation = context_estimate(family, system, conversation, previous)
              total = observation['estimated_total']
              record(family + '-context-budget.json', observation)
              if total > CONTEXT_TOKEN_BUDGET:
                  raise RuntimeError(f'{family} context budget exceeded before the next model request: estimated {total:,} including reserves; limit {CONTEXT_TOKEN_BUDGET:,}. Narrow or split the review scope; no history was truncated.')
              return observation


          def model_turn(family, system, conversation):
              body = model_body(family, system, conversation)
              if family == "astra":
                  response = request("https://api.openai.com/v1/responses",
                                     {"Authorization": "Bearer " + os.environ["OPENAI_API_KEY"]}, "POST", body, True)
                  final = None
                  for event in sse(response):
                      if event.get("type") == "response.completed":
                          final = event["response"]
                      elif event.get("type") in {"error", "response.failed", "response.incomplete"}:
                          raise RuntimeError(json.dumps(event))
                  if final is None or final.get("status") != "completed":
                      raise RuntimeError("OpenAI stream ended without a completed response")
                  return final["output"], final.get("model"), final.get("usage"), final["id"], final["status"]
              response = request("https://api.anthropic.com/v1/messages",
                                 {"x-api-key": os.environ["ANTHROPIC_API_KEY"], "anthropic-version": "2023-06-01"}, "POST", body, True)
              final, blocks, partial, stopped, initial_inputs = {}, {}, {}, False, None
              for event in sse(response):
                  kind = event.get("type")
                  if kind == "error":
                      raise RuntimeError(json.dumps(event))
                  if kind == "message_start":
                      final = event["message"]
                      initial_usage = final.get('usage') or {}
                      fields = ('input_tokens', 'cache_read_input_tokens', 'cache_creation_input_tokens')
                      if 'input_tokens' in initial_usage and all(type(initial_usage.get(k, 0)) is int and initial_usage.get(k, 0) >= 0 for k in fields):
                          initial_inputs = sum(initial_usage.get(k, 0) for k in fields)
                  elif kind == "content_block_start":
                      blocks[event["index"]] = event["content_block"]
                  elif kind == "content_block_delta":
                      index, delta = event["index"], event["delta"]
                      field = {"text_delta": "text", "thinking_delta": "thinking", "signature_delta": "signature"}.get(delta["type"])
                      if field:
                          blocks[index][field] = blocks[index].get(field, "") + delta[field]
                      elif delta["type"] == "input_json_delta":
                          partial[index] = partial.get(index, "") + delta["partial_json"]
                      elif delta["type"] == "citations_delta":
                          blocks[index].setdefault("citations", []).append(delta["citation"])
                      else:
                          raise RuntimeError("Unrecognized Anthropic delta: " + delta["type"])
                  elif kind == "content_block_stop" and event["index"] in partial:
                      blocks[event["index"]]["input"] = json.loads(partial[event["index"]] or "{}")
                  elif kind == "message_delta":
                      final.update(event["delta"])
                      final.setdefault("usage", {}).update(event.get("usage", {}))
                  elif kind == "message_stop":
                      stopped = True
              if not stopped or final.get("stop_reason") not in {"tool_use", "end_turn", "pause_turn"}:
                  raise RuntimeError("Anthropic response blocked: " + json.dumps({"stream_complete": stopped,
                                     "stop_reason": final.get("stop_reason"), "stop_details": final.get("stop_details")}))
              if initial_inputs is not None:
                  final.setdefault('usage', {})['request_start_input_tokens'] = initial_inputs
              return [blocks[i] for i in sorted(blocks)], final.get("model"), final.get("usage"), final.get("id"), final.get("stop_reason")


          def working_comment_body(working):
              """Keep the latest prose within one comment; complete notes live in artifacts."""
              value = {**working, 'notes': list(working['notes'])}
              def render():
                  notice = 'Partial review, not a verdict.'
                  if value.get('earlier_notes_in_artifact'):
                      notice += '\nEarlier notes are in the run artifact: ' + value['artifact_url']
                  return WORKING_MARKER + '\n' + notice + '\n```json\n' + json.dumps(value, ensure_ascii=False) + '\n```'
              if len(render().encode('utf-8')) <= 45_000:
                  return render()
              value['earlier_notes_in_artifact'] = True
              while len(value['notes']) > 1 and len(render().encode('utf-8')) > 45_000:
                  value['notes'].pop(0)
              if len(render().encode('utf-8')) > 45_000:
                  # One note can itself exceed the limit. Find a suffix that fits, taking
                  # UTF-8 bytes and JSON escaping into account rather than counting chars.
                  note = value['notes'][0]
                  low, high = 0, len(note)
                  while low < high:
                      keep = (low + high + 1) // 2
                      value['notes'] = ['[Earlier text in run artifact]\n' + note[-keep:]]
                      if len(render().encode('utf-8')) <= 45_000:
                          low = keep
                      else:
                          high = keep - 1
                  value['notes'] = ['[Earlier text in run artifact]\n' + (note[-low:] if low else '')]
              return render()


          class Review:
              def __init__(self, gh, pr, files, history, prior, overrides, instructions, family, change_class):
                  self.gh, self.pr, self.family = gh, pr, family
                  self.history, self.prior, self.overrides = history, prior, overrides
                  self.instructions = instructions
                  self.history_read, self.reads, self.tree, self.chars = False, [], None, 0
                  self.file_lines, self.working_comment, self.notes = {}, None, []
                  self.input = {"repository": gh.repo, "pull_request": pr["number"], "head": pr["head"]["sha"],
                                "base": pr["base"]["sha"], "change_class": change_class,
                                "untrusted_title": pr["title"], "untrusted_description": pr.get("body"), "files": files}

              def tool(self, name, args):
                  if name == "read_history":
                      self.history_read = True
                      return {"discussion": self.history, "earlier_findings": self.prior, "authenticated_overrides": self.overrides}
                  if name == "read_file":
                      if args["revision"] not in {"head", "base"}:
                          raise ValueError("Invalid revision")
                      ref = self.pr[args["revision"]]["sha"]
                      path = args["path"]
                      start, count = args["start"], args["count"]
                      if not isinstance(start, int) or not isinstance(count, int) or start < 1 or not 1 <= count <= 1000:
                          raise ValueError("Read 1 to 1000 lines, starting at line 1 or later")
                      if path.lower().endswith(".pdf"):
                          return {"pdf_url": "https://raw.githubusercontent.com/" + self.gh.repo + "/" + ref + "/" + urllib.parse.quote(path),
                                  "instruction": "Read via web tools; an unavailable source is not verified."}
                      if (path, ref) not in self.file_lines:
                          self.file_lines[path, ref] = self.gh.text(path, ref).splitlines()
                      lines = self.file_lines[path, ref]
                      result = "\n".join(f"{i+1}: {lines[i]}" for i in range(start-1, min(len(lines), start-1+count)))
                      if len(result) > 100_000:
                          raise ValueError("Requested lines exceed 100,000 characters; request fewer lines")
                      self.reads.append({"path": path, "revision": ref, "start": start, "count": count})
                      return {"total_lines": len(lines), "text": result}
                  if name == "list_files":
                      if self.tree is None:
                          tree = self.gh.call("/git/trees/" + self.pr["head"]["sha"] + "?recursive=1")
                          if tree.get("truncated"):
                              raise ValueError("GitHub truncated the tree; cannot claim complete file discovery")
                          self.tree = [x["path"] for x in tree["tree"] if x["type"] == "blob"]
                      matches = [p for p in self.tree if args["contains"] in p]
                      offset = args["offset"]
                      if not isinstance(offset, int) or offset < 0:
                          raise ValueError("Invalid offset")
                      return {"total": len(matches), "paths": matches[offset:offset+200], "next_offset": offset+200 if offset+200 < len(matches) else None}
                  raise ValueError("Unknown tool")

              def run(self):
                  conversation = [{"role": "user", "content": json.dumps(self.input)}]
                  record(self.family + "-input.json", {"instructions": self.instructions, "input": self.input})
                  turns, previous = [], None
                  for turn in range(50):
                      log(f"{self.family}: model turn {turn+1}; {len(self.reads)} repository source reads")
                      budget = context_budget(self.family, self.instructions, conversation, previous)
                      output, served, usage, response_id, stop_reason = model_turn(self.family, self.instructions, conversation)
                      previous = {**budget, 'usage': usage,
                                  'server_tools': any(x.get('type') == 'server_tool_use' for x in output)}
                      if served != MODELS[self.family]:
                          raise RuntimeError(f"Requested {MODELS[self.family]}, API reported {served}; no silent substitution")
                      # The exact provider conversation, including signed/encrypted reasoning,
                      # stays in memory. Retain inputs, source reads, visible report and usage.
                      visible = [{k: v for k, v in x.items() if k not in {"thinking", "signature", "encrypted_content"}}
                                 for x in output if x.get("type") not in {"thinking", "reasoning", "redacted_thinking"}]
                      turns.append({"response_id": response_id, "reported_model": served, "usage": usage, "context_budget": budget, "stop_reason": stop_reason, "visible_output": visible})
                      record(self.family + "-turns.json", turns)
                      # Preserve prose objections before the next model request. These are
                      # discussion, never approval. A failed later turn cannot erase them.
                      prose = []
                      for item in visible:
                          if item.get("type") == "text":
                              prose.append(item.get("text", ""))
                          elif item.get("type") == "message":
                              prose.extend(c.get("text", "") for c in item.get("content", []) if c.get("type") == "output_text")
                      text = "\n".join(prose).strip()
                      if text:
                          self.notes.append(text)
                          # One evolving working comment per reviewer/run, not a new
                          # notification on every turn. Complete output is in artifacts.
                          working = {"reviewer": self.family, "head": self.pr['head']['sha'],
                                     "run": os.environ['GITHUB_RUN_ID'], "attempt": os.environ['GITHUB_RUN_ATTEMPT'],
                                     "notes": self.notes,
                                     "artifact_url": f"https://github.com/{self.gh.repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}"}
                          record(self.family + '-working-notes.json', working)
                          body = working_comment_body(working)
                          if self.working_comment is None:
                              self.working_comment = self.gh.call(f"/issues/{self.pr['number']}/comments", "POST", {"body": body})['id']
                          else:
                              self.gh.call(f"/issues/comments/{self.working_comment}", "PATCH", {"body": body})
                      if self.family == "astra":
                          conversation.extend(output)
                          calls = [x for x in output if x.get("type") == "function_call"]
                      else:
                          conversation.append({"role": "assistant", "content": output})
                          calls = [x for x in output if x.get("type") == "tool_use"]
                      results = []
                      finish = [x for x in calls if x.get("name") == "finish_review"]
                      if finish:
                          if len(calls) != 1 or not self.history_read or not self.reads:
                              raise ValueError("Final review requires prior source/history reads and no concurrent tool calls")
                          value = json.loads(finish[0]["arguments"]) if self.family == "astra" else finish[0]["input"]
                          value = validate_review(value, set(self.prior), self.overrides)
                          record(self.family + "-source-reads.json", self.reads)
                          return value
                      if not calls and stop_reason != "pause_turn":
                          # A paused server-tool turn is resumed with its assistant
                          # message unchanged, with no inserted user message.
                          conversation.append({"role": "user", "content": "Continue the review. When finished use finish_review; prose alone cannot pass the gate."})
                      # Reserve a small error result for every pending call before admitting
                      # large reads. Parallel calls share one next-request budget.
                      notice = 'Estimated remaining allowance; use smaller reads or narrower searches. Repository reads are never truncated.'
                      web_remaining = web_allowance(self.family, conversation)
                      rejected = {'error': 'Read too large for the remaining review allowance. Request fewer lines or a narrower result.',
                                  'remaining_context_tokens': 0, 'remaining_tool_characters': 0,
                                  'budget_notice': notice, 'web_uses_remaining': web_remaining}
                      values = [dict(rejected) for _ in calls]

                      def next_conversation(proposed):
                          if self.family == 'astra':
                              return conversation + [
                                  {'type': 'function_call_output', 'call_id': c['call_id'],
                                   'output': json.dumps(v, ensure_ascii=False)} for c, v in zip(calls, proposed)]
                          return conversation + [{'role': 'user', 'content': [
                              {'type': 'tool_result', 'tool_use_id': c['id'],
                               'content': json.dumps(v, ensure_ascii=False)} for c, v in zip(calls, proposed)]}]

                      def allowance(proposed):
                          estimated = context_estimate(self.family, self.instructions,
                                                       next_conversation(proposed), previous)
                          # Leave space for allowance metadata and a recovery/decision turn.
                          return max(0, CONTEXT_TOKEN_BUDGET - RECOVERY_TOKEN_RESERVE - estimated['estimated_total'])

                      for call_index, call in enumerate(calls):
                          args = json.loads(call["arguments"]) if self.family == "astra" else call["input"]
                          reads_before, history_before = len(self.reads), self.history_read
                          try:
                              value = self.tool(call["name"], args)
                          except (ValueError, UnicodeError) as error:
                              value = {"error": str(error)}
                          value = {**value, 'remaining_context_tokens': 0,
                                   'remaining_tool_characters': 0, 'budget_notice': notice, 'web_uses_remaining': web_remaining}
                          values[call_index] = value
                          estimated = context_estimate(self.family, self.instructions,
                                                       next_conversation(values), previous)
                          content = json.dumps(value, ensure_ascii=False)
                          if (estimated['estimated_total'] > CONTEXT_TOKEN_BUDGET - RECOVERY_TOKEN_RESERVE
                                  or self.chars + len(content) + 128 > 1_200_000):
                              value = dict(rejected)
                              values[call_index] = value
                              # Fetching a source is not evidence that the reviewer saw it.
                              del self.reads[reads_before:]
                              self.history_read = history_before
                          value['remaining_context_tokens'] = max(0, allowance(values) - 128)
                          value['remaining_tool_characters'] = max(0, 1_200_000 - self.chars - len(json.dumps(value, ensure_ascii=False)) - 128)
                          content = json.dumps(value, ensure_ascii=False)
                          self.chars += len(content)
                          record(self.family + f"-tool-{turn}-{call_index}.json", {"name": call["name"], "arguments": args, "result": value})
                      if calls:
                          conversation = next_conversation(values)
                  raise RuntimeError("50 model turns exhausted; no acceptance")


          def finding_id(report, local_id):
              return f"{report['run']}-{report['attempt']}-{report['reviewer']}-{local_id}"


          def own_comment(gh, comment):
              return comment["user"]["login"] == "github-actions[bot]"


          def history(gh, pr):
              comments = gh.pages(f"/issues/{pr['number']}/comments")
              discussion = [{"id": c["id"], "author": c["user"]["login"], "created": c["created_at"], "body": c["body"]}
                            for c in comments if not (own_comment(gh, c) and c["body"].startswith((MARKER, WORKING_MARKER, "<!-- protocol-b-working-note -->")))]
              for endpoint in ("reviews", "comments"):
                  discussion.extend(gh.pages(f"/pulls/{pr['number']}/" + endpoint))
              prior, overrides, latest, completed_runs = {}, {}, {}, set()
              for comment in comments:
                  body = comment["body"]
                  if body.startswith(MARKER) and own_comment(gh, comment):
                      # Earlier verdicts never count as approval of this revision. All
                      # objections, including previously resolved ones, are shown again.
                      match = re.search(r"```json\n(.*)\n```", body, re.S)
                      if match is None:
                          raise ValueError("Earlier gate report is malformed; recover it rather than discard its findings")
                      report = json.loads(match[1])
                      for finding in report["review"]["findings"]:
                          prior[finding_id(report, finding['id'])] = finding
                      key = (report['run'], report['attempt'], report['reviewer'])
                      if report.get('complete'):
                          completed_runs.add(key)
                      if report.get('head') == pr['head']['sha']:
                          latest[report['reviewer']] = report
              for comment in comments:
                  if own_comment(gh, comment) and comment['body'].startswith(WORKING_MARKER):
                      working = json.loads(re.search(r"```json\n(.*)\n```", comment['body'], re.S)[1])
                      if (working['run'], working['attempt'], working['reviewer']) not in completed_runs:
                          # A failed or cancelled review's actual observations survive.
                          # Do not turn an HTTP outage without observations into a
                          # permanent mathematical objection.
                          discussion.append({'incomplete_review': working, 'source': comment.get('html_url')})
              pattern = re.compile(r"^/protocol-b override ([0-9a-f]{40}) ([A-Za-z0-9_-]+)\s+(.+)$", re.S)
              for comment in comments:
                  match = pattern.fullmatch(comment["body"].strip())
                  if match and match[1] == pr["head"]["sha"] and match[2] in prior:
                      login = comment["user"]["login"]
                      permission = gh.call("/collaborators/" + urllib.parse.quote(login, safe="") + "/permission")
                      if permission["permission"] in {"write", "maintain", "admin"} and comment["user"].get("type") == "User":
                          overrides[match[2]] = {"collaborator": login, "reason": match[3], "url": comment["html_url"]}
              return discussion, prior, overrides, latest


          def overridden_decision(latest, overrides, head):
              """A collaborator, not a reviewer model, decides a covered deadlock."""
              if set(latest) != set(MODELS):
                  raise ValueError("Override needs complete reports from both approved reviewers on this head")
              unresolved = set()
              for family, envelope in latest.items():
                  if not envelope.get('complete') or envelope.get('head') != head or envelope.get('model') != MODELS[family]:
                      raise ValueError("Override cannot replace an incomplete, stale or wrong-model review")
                  value = envelope['review']
                  here = {finding_id(envelope, f['id']) for f in value['findings']}
                  here.update(f['id'] for f in value['prior_findings'] if f['resolution'] != 'resolved')
                  if value['decision'] != 'accept' and not here:
                      raise ValueError("Reviewer rejected without scoped findings; request a complete report")
                  unresolved.update(here)
              missing = unresolved - set(overrides)
              if missing:
                  raise ValueError("Uncovered findings: " + ", ".join(sorted(missing)))
              if not unresolved:
                  raise ValueError("No deadlock needs overriding; request an ordinary review")
              return {key: overrides[key] for key in sorted(unresolved)}


          def same_policy(gh, previous, current):
              return all(gh.text(path, previous) == gh.text(path, current) for path in (WORKFLOW, INSTRUCTIONS))


          def findings_summary(reports):
              rows = []
              for envelope in reports.values():
                  for finding in envelope['review']['findings']:
                      rows.append(f"- `{finding_id(envelope, finding['id'])}`: {finding.get('location', '')}: {finding.get('objection', '')}")
                  for prior in envelope['review'].get('prior_findings', []):
                      if prior['resolution'] == 'unresolved':
                          rows.append(f"- `{prior['id']}`: {prior['reason']}")
              return "\n\nFinding IDs for collaborator decisions:\n" + "\n".join(dict.fromkeys(rows)) if rows else ""


          def trusted_reports(app, pr, name, exclude):
              """Override authority comes from this App's own check, never a bot comment."""
              candidates = []
              for page in range(1, 101):
                  response = app.call(f"/commits/{pr['head']['sha']}/check-runs?filter=all&per_page=100&page={page}")
                  for check in response['check_runs']:
                      if (check['id'] != exclude and check['name'] == name and
                              check['app']['id'] == int(os.environ['APP_ID']) and
                              (check.get('output', {}).get('text') or '').startswith('{')):
                          value = json.loads(check['output']['text'])
                          if value.get('schema') == 'protocol-b-decisions/v1' and value.get('head') == pr['head']['sha']:
                              candidates.append((check['id'], value['reports']))
                  if len(response['check_runs']) < 100:
                      return max(candidates, default=(0, {}))[1]
              raise ValueError('Too many prior checks; no partial override decision')


          def start_clients():
              gh = GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'])
              app_id = int(os.environ['APP_ID'])
              if app_id <= 0 or app_id == 15368:
                  raise ValueError('A dedicated App ID is required; GitHub Actions is not the review identity')
              app = GitHub(gh.repo, os.environ['APP_TOKEN'])
              return gh, app


          def main():
              mode = os.environ.get("MODE", "off")
              if mode not in {"test", "live"}:
                  log("Protocol B is inactive. No model requests, reports or merges.")
                  return
              event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              gh, app = start_clients()
              repo = gh.call("")
              default = repo["default_branch"]
              trusted_ref = gh.call("/commits/" + urllib.parse.quote(default, safe=""))["sha"]
              # Prevent a dispatch of a modified workflow from another branch. For
              # pull_request_target, GitHub runs the protected base's workflow by design.
              if os.environ["GITHUB_REF"] != "refs/heads/" + default:
                  raise ValueError("Gate must run from the default branch")
              number = (event.get("pull_request") or event.get("issue") or {}).get("number") or event.get("inputs", {}).get("pull_request")
              number = int(number)
              if mode == "test" and number != int(os.environ.get("TEST_PR", "0")):
                  log("Test mode: this is not the designated throwaway PR; no action.")
                  return
              override_command = False
              if "comment" in event:
                  command = event["comment"]["body"].strip()
                  if not command.startswith(("/protocol-b review", "/protocol-b override ")):
                      return
                  login = event["sender"]["login"]
                  if gh.call("/collaborators/" + urllib.parse.quote(login, safe="") + "/permission")["permission"] not in {"write", "maintain", "admin"}:
                      return
                  override_command = command.startswith('/protocol-b override ')
              pr = gh.call(f"/pulls/{number}")
              if pr["state"] != "open" or pr["draft"] or pr["base"]["ref"] != default:
                  return
              # Refuse a runner executing superseded trusted code, before publishing a check.
              if not same_policy(gh, os.environ['GITHUB_SHA'], trusted_ref):
                  raise ValueError("Trusted workflow or instructions changed; start a fresh run")
              instructions = gh.text(INSTRUCTIONS, os.environ['GITHUB_SHA'])
              name = CHECK if mode == "live" else "Protocol B / test review"
              run_url = f"https://github.com/{gh.repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              # Start blocked rather than leaving an indefinitely pending check if this
              # runner is cancelled, times out, or is lost. Finalization replaces this.
              check = app.call("/check-runs", "POST", {"name": name, "head_sha": pr["head"]["sha"],
                              "status": "completed", "conclusion": "action_required", "details_url": run_url,
                              "output": {"title": "Review not yet accepted", "summary": "The review is running. Only completed acceptance can replace this blocked state."}})
              if check['app']['id'] != int(os.environ['APP_ID']):
                  raise ValueError('Check was not created by the configured dedicated App')
              conclusion, summary = "failure", "Review did not finish. See the workflow log."
              state = {'number': number, 'head': pr['head']['sha'], 'base': pr['base']['sha'], 'check': check['id'],
                       'name': name, 'mode': mode, 'policy_ref': os.environ['GITHUB_SHA'], 'default': default,
                       'conclusion': conclusion, 'summary': summary, 'reports': {}}
              record('decision.json', state)
              envelopes = {}
              try:
                  files = gh.pages(f"/pulls/{number}/files")
                  if len(files) != pr["changed_files"]:
                      raise ValueError("GitHub omitted changed files; cannot review an incomplete diff")
                  # Even missing patches remain listed so both reviewers must fetch sources.
                  declaration = "No mathematical content changed." in (pr.get("body") or "")
                  change_class = classify(files, declaration)
                  discussion, prior, overrides, _ = history(gh, pr)
                  record("context.json", {"head": pr["head"]["sha"], "base": pr["base"]["sha"],
                                         "trusted_workflow": trusted_ref, "class": change_class,
                                         "prior_findings": prior, "overrides": overrides, "discussion": discussion})
                  if override_command:
                      envelopes = trusted_reports(app, pr, name, check['id'])
                      for envelope in envelopes.values():
                          if not same_policy(gh, envelope['policy_ref'], trusted_ref):
                              raise ValueError('Override reports used a different review policy')
                      applied = overridden_decision(envelopes, overrides, pr['head']['sha'])
                      conclusion = 'success'
                      summary = 'Accepted by collaborator override, not by unanimous model acceptance. Affected claims are NOT outside reviewed.\n' + json.dumps(applied, indent=2)
                      state['overrides'] = applied
                      gh.call(f'/issues/{number}/comments', 'POST', {'body': summary + findings_summary(envelopes)})
                  elif change_class == "editorial" and not prior:
                      conclusion, summary = "success", "Editorial change under the path/diff rule; author declared no mathematical change. No model review."
                  else:
                      for key in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY"):
                          if not os.environ.get(key):
                              raise ValueError("Missing protocol-b environment secret " + key)
                      reviews, failures = {}, {}
                      with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                          futures = {pool.submit(Review(gh, pr, files, discussion, prior, overrides, instructions, family, change_class).run): family for family in MODELS}
                          for future in concurrent.futures.as_completed(futures):
                              family = futures[future]
                              try:
                                  value = future.result()
                                  envelope = {"reviewer": family, "model": MODELS[family], "head": pr["head"]["sha"],
                                              "base": pr["base"]["sha"], "run": os.environ["GITHUB_RUN_ID"],
                                              "attempt": os.environ["GITHUB_RUN_ATTEMPT"], "review": value,
                                              "complete": True, "policy_ref": os.environ['GITHUB_SHA']}
                                  envelopes[family] = envelope
                                  record(family + "-report.json", envelope)
                                  # Append, never edit away an objection. Each completed
                                  # review is saved even if the other reviewer fails.
                                  body = MARKER + "\n" + run_url + "\n```json\n" + json.dumps(envelope, ensure_ascii=False, indent=2) + "\n```"
                                  gh.call(f"/issues/{number}/comments", "POST", {"body": body})
                                  reviews[family] = value
                              except Exception as error:
                                  failures[family] = str(error)
                                  log(f"{family}: failed: {error}")
                                  # Preserve partial observations, but an infrastructure
                                  # error by itself is not a mathematical finding.
                                  problem = {"reviewer": family, "model": MODELS[family], "head": pr["head"]["sha"],
                                             "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                                             "complete": False, "policy_ref": os.environ['GITHUB_SHA'],
                                             "review": {"decision": "changes_requested", "report": "Infrastructure failure, not a model verdict: " + str(error),
                                                        "findings": [], "prior_findings": []}}
                                  envelopes[family] = problem
                                  record(family + "-failure.json", problem)
                                  gh.call(f"/issues/{number}/comments", "POST", {"body": MARKER + "\n```json\n" + json.dumps(problem, ensure_ascii=False, indent=2) + "\n```"})
                      if failures:
                          raise RuntimeError(json.dumps(failures))
                      if all(v["decision"] == "accept" for v in reviews.values()) and set(reviews) == set(MODELS):
                          conclusion = "success"
                          summary = "Both approved reviewers accepted this revision. When either family authored the change, only the other is an outside reviewer. This is informal review, not a formal proof."
                          if overrides:
                              summary += "\nCollaborator overrides apply; affected claims are NOT outside reviewed:\n" + json.dumps(overrides, indent=2)
                      else:
                          summary = "At least one reviewer requests changes. Resolve the recorded findings; a favorable second report cannot override them."
                  current = gh.call(f"/pulls/{number}")
                  latest_ref = gh.call('/commits/' + default)['sha']
                  if current['head']['sha'] != pr['head']['sha'] or not same_policy(gh, state['policy_ref'], latest_ref):
                      raise ValueError('PR head or trusted review policy changed during review; this run cannot approve')
              except Exception as error:
                  conclusion, summary = "failure", str(error)
                  record("failure.json", {"message": str(error)})
                  log("Review failed: " + str(error))
              summary += findings_summary(envelopes)
              state.update(conclusion=conclusion, summary=summary, reports=envelopes)
              record('decision.json', state)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
                  output.write(summary + "\n")
              if conclusion != "success":
                  raise RuntimeError("Protocol B review is blocked")


          def required_checks_passed(gh, head, requirements):
              """Conservative readiness check; GitHub still enforces rules on merge."""
              checks, seen, total = [], set(), None
              for page in range(1, 101):
                  value = gh.call(f"/commits/{head}/check-runs?filter=latest&per_page=100&page={page}")
                  if total is not None and value['total_count'] != total:
                      raise ValueError('Check list changed during pagination; no merge requested')
                  total = value['total_count']
                  rows = value['check_runs']
                  for check in rows:
                      if check['id'] in seen or check['head_sha'] != head:
                          raise ValueError('Duplicate or wrong-head check; no merge requested')
                      seen.add(check['id'])
                      checks.append(check)
                  if len(checks) == total:
                      break
                  if not rows or len(checks) > total:
                      raise ValueError('Incomplete check list; no merge requested')
              else:
                  raise ValueError('Check pagination limit reached; no merge requested')
              # A legacy status with the same name also has to pass. Statuses lack
              # an App identity here, so they cannot satisfy an App-pinned rule.
              statuses = {}
              for status in gh.pages(f"/commits/{head}/statuses"):
                  context = status['context'].casefold()
                  prior = statuses.get(context)
                  if prior is None or status['id'] > prior['id']:
                      statuses[context] = status
              for rule in requirements:
                  name, integration = rule['context'], rule.get('integration_id')
                  pinned = integration not in (None, -1)
                  matches = [c for c in checks if c['name'] == name and
                             (c.get('app') or {}).get('id') is not None and
                             (not pinned or (c.get('app') or {}).get('id') == integration)]
                  status = statuses.get(name.casefold())
                  if status is not None and status['state'] != 'success':
                      return False
                  if not matches and (pinned or status is None):
                      return False
                  if any(c['status'] != 'completed' or c['conclusion'] != 'success' for c in matches):
                      return False
              return bool(requirements)


          def publish():
              """Use a fresh official-action token after the potentially long review."""
              path = OUT / 'decision.json'
              if not path.is_file():
                  log('No check was created; nothing to finalize')
                  return
              state = json.loads(path.read_text(encoding='utf-8'))
              gh, app = start_clients()
              current = gh.call(f"/pulls/{state['number']}")
              latest_ref = gh.call('/commits/' + state['default'])['sha']
              check = app.call(f"/check-runs/{state['check']}")
              if check['app']['id'] != int(os.environ['APP_ID']) or check['head_sha'] != state['head'] or check['name'] != state['name']:
                  raise ValueError('Finalization identity mismatch')
              if current['head']['sha'] != state['head'] or not same_policy(gh, state['policy_ref'], latest_ref):
                  state.update(conclusion='failure', summary='Head or review policy changed; no acceptance.')
              # Keep authoritative, compact decisions on the App check. GitHub Actions
              # comments can be forged by another workflow and cannot authorize overrides.
              compact = json.loads(json.dumps(state['reports']))
              for envelope in compact.values():
                  envelope['review'].pop('report', None)
                  envelope['review'].pop('sources_read', None)
              text = json.dumps({'schema': 'protocol-b-decisions/v1', 'head': state['head'], 'reports': compact})
              if len(text.encode()) > 60_000 or len(state['summary'].encode()) > 60_000:
                  raise ValueError('Check output exceeds capacity; remains blocked, never truncate findings')
              app.call(f"/check-runs/{state['check']}", 'PATCH', {'status': 'completed', 'conclusion': state['conclusion'],
                       'output': {'title': state['name'], 'summary': state['summary'], 'text': text}})
              if state['conclusion'] != 'success':
                  raise RuntimeError('Protocol B review is blocked')
              if state['mode'] == 'live':
                  # Preserve the protected route for both immediate and deferred merges.
                  rules = gh.pages("/rules/branches/" + urllib.parse.quote(state['default'], safe=""))
                  required = {c["context"] for rule in rules if rule["type"] == "required_status_checks"
                              for c in rule["parameters"]["required_status_checks"]}
                  if not ({CHECK} | REQUIRED_COMPUTATIONS) <= required:
                      raise RuntimeError("Auto-merge withheld: the reviewer check or computation protections are not required")
                  if not any(c['context'] == CHECK and c.get('integration_id') == int(os.environ['APP_ID'])
                             for rule in rules if rule['type'] == 'required_status_checks'
                             for c in rule['parameters']['required_status_checks']):
                      raise RuntimeError('Auto-merge withheld: required review check is not pinned to the dedicated App')
                  if not any(rule["type"] == "required_status_checks" and rule["parameters"].get("strict_required_status_checks_policy") for rule in rules):
                      raise RuntimeError("Auto-merge withheld: require an up-to-date branch so changed base dependencies cannot bypass review")
                  if not gh.call('').get("allow_auto_merge"):
                      raise RuntimeError("Review passed, but repository auto-merge is disabled; complete the owner-approved activation checklist")
                  requirements = [c for rule in rules if rule['type'] == 'required_status_checks'
                                  for c in rule['parameters']['required_status_checks']]
                  ready = required_checks_passed(gh, state['head'], requirements)
                  record('merge-readiness.json', {'head': state['head'], 'requirements': requirements,
                                                 'all_required_checks_passed': ready})
                  current = gh.call(f"/pulls/{state['number']}")
                  if current["head"]["sha"] != state['head']:
                      raise RuntimeError("Head changed before requesting merge")
                  if current['base']['ref'] != state['default'] or current['state'] != 'open' or current['draft']:
                      raise RuntimeError('PR is no longer open and ready for the protected default branch')
                  latest_ref = gh.call('/commits/' + state['default'])['sha']
                  if not same_policy(gh, state['policy_ref'], latest_ref):
                      raise RuntimeError('Review policy changed before requesting merge')
                  if ready:
                      comparison = gh.call(f"/compare/{latest_ref}...{state['head']}")
                      behind = comparison.get('behind_by')
                      record('merge-base-check.json', {'default_tip': latest_ref, 'head': state['head'],
                                                       'behind_by': behind})
                      if type(behind) is not int or behind != 0:
                          raise RuntimeError('Direct merge withheld: reviewed head must contain the current default-branch tip')
                      # Do not gate on mergeable_state: the running, non-required
                      # gate job itself can leave it "unstable". Deployment requires
                      # an empty ruleset bypass list. The merge API checks this SHA.
                      result = gh.call(f"/pulls/{state['number']}/merge", 'PUT',
                                       {'sha': state['head'], 'merge_method': 'merge'})
                      record('merge-result.json', result)
                      if result.get('merged') is not True:
                          raise RuntimeError('Direct merge was not confirmed: ' + json.dumps(result))
                      log('Reviewed head merged as ' + result['sha'] + '. GITHUB_TOKEN does not trigger push workflows; post-merge checks need explicit dispatch.')
                  elif not current.get("auto_merge"):
                      result = gh.api("/graphql", "POST", {"query": "mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{id}}}", "variables": {"id": current["node_id"]}})
                      record('auto-merge-result.json', result)
                      if result.get("errors"):
                          raise RuntimeError(json.dumps(result["errors"]))
                      log("Review accepted; GitHub auto-merge waits for the required computation checks.")
                  else:
                      log('Review accepted; GitHub auto-merge is already enabled.')
              else:
                  log("Test accepted. Auto-merge is disabled in test mode.")


          if __name__ == "__main__":
              publish() if len(sys.argv) > 1 and sys.argv[1] == 'publish' else main()
          PROTOCOL_B_PYTHON
          python3 "$RUNNER_TEMP/protocol-b.py" review
      - name: Mint fresh token after the review
        if: always() && steps.app_start.outcome == 'success' && steps.review.outcome != 'skipped'
        id: app_finish
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PROTOCOL_B_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_B_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Finalize the App check and request a protected merge
        if: always() && steps.app_finish.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app_finish.outputs.token }}
          APP_ID: ${{ vars.PROTOCOL_B_APP_ID }}
        run: python3 "$RUNNER_TEMP/protocol-b.py" publish
      - name: Preserve reports and diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/protocol-b-reports/
          if-no-files-found: ignore
          retention-days: 90
