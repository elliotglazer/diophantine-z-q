name: Scalar preparation-zero research replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scalar-preparation-zero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparation-zero:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: python -B research/scalar-preparation-zero/reproduce.py --output build/preparation-zero
      - run: python -B scripts/check_audit_history.py --self-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scalar-preparation-zero-receipts
          path: |
            build/preparation-zero/reproduction-receipt.json
            build/preparation-zero/reproduction.log
            build/preparation-zero/candidate/*check.json
            build/preparation-zero/candidate/free-omission.json
            build/preparation-zero/factored/*check.json
            build/preparation-zero/factored/balanced/summary.json
            build/preparation-zero/factored/quartic-383-balanced-decimal.txt
