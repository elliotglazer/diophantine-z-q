name: Quartic 214 manuscript

on:
  pull_request:
    paths:
      - 'research/quartic214-manuscript/**'
      - 'research/quartic214-manuscript-review/**'
      - 'research/quartic214/**'
      - 'research/quartic214-main-integration/**'
      - 'research/quartic214-protocol-d-public/**'
      - 'manuscripts/quartic_v16.tex'
      - 'research/version16/**'
      - 'docs/current-manuscript.json'
      - 'README.md'
      - '.github/workflows/quartic214-manuscript.yml'
  push:
    branches:
      - 'proposal/quartic-214-protocol-d'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript:
    name: Serial TeX/PDF and manuscript review bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install the TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y texlive-latex-extra texlive-fonts-recommended lmodern poppler-utils
      - name: Verify deterministic source assembly
        run: python -B research/quartic214-manuscript/assemble.py --check
      - name: Check corrected formulas and stale-source rejection
        run: |
          ulimit -v 1048576
          python -B research/quartic214-manuscript/check_source_corrections.py
      - name: Rebuild the PDF serially within its resource limits
        run: python -B research/quartic214-manuscript/build_pdf.py --check
      - name: Check scoped correction review and artifact bindings
        run: python -B research/quartic214-main-integration/check_historical_records.py --self-test --reviewed-artifacts
      - name: Check the retained proof and audit records
        run: |
          python -B research/quartic214/check_port.py
          python -B research/quartic214-protocol-d-public/check_records.py --self-test --require-scoped-review
          python -B scripts/check_audit_history.py --self-test
      - name: Require unchanged committed artifacts
        run: git diff --exit-code
