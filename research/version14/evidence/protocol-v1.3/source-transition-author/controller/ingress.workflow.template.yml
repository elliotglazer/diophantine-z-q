name: Protected protocol observation ingress

on:
  workflow_dispatch:
    inputs:
      batch:
        description: Owner-committed JSON path under controller/ingress-batches/
        required: true
        type: string

# Must be exactly the same group as the evaluator/publisher workflow.
concurrency:
  group: protocol-controller-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingress:
    if: >-
      github.repository == 'elliotglazer/research-review-controller' &&
      github.ref == 'refs/heads/main' &&
      github.sha == vars.PROTOCOL_APPROVED_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the approved private controller only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ vars.PROTOCOL_APPROVED_SHA }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Install reviewed controller dependencies
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          python3 -m venv "$RUNNER_TEMP/protocol-venv"
          "$RUNNER_TEMP/protocol-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r controller/requirements.lock
      - name: Sign actual observations and append complete protected state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROTOCOL_APPROVED_SHA: ${{ vars.PROTOCOL_APPROVED_SHA }}
          PROTOCOL_APP_PRIVATE_KEY: ${{ secrets.PROTOCOL_APP_PRIVATE_KEY }}
          PROTOCOL_OPERATOR_KEYS: ${{ secrets.PROTOCOL_OPERATOR_KEYS }}
          PROTOCOL_INTAKE_KEYS: ${{ secrets.PROTOCOL_INTAKE_KEYS }}
          PROTOCOL_COLLECTOR_KEYS: ${{ secrets.PROTOCOL_COLLECTOR_KEYS }}
          PROTOCOL_INGRESS_BATCH: ${{ inputs.batch }}
        run: '"$RUNNER_TEMP/protocol-venv/bin/python" -B controller/ingress.py'
